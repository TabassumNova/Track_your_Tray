[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "track-your-tray"
version = "0.1.0"
description = "ROI detection and tracking for trays using ArUco markers"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}

dependencies = [
    "streamlit>=1.0.0",
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "Pillow>=8.0.0",
    # TODO: Add other dependencies from requirements.txt
]

[project.scripts]
track = "track_your_tray.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/Track_your_Tray"
Repository = "https://github.com/yourusername/Track_your_Tray.git"

[tool.setuptools]
packages = ["track_your_tray"]

[tool.setuptools.package-data]
track_your_tray = ["**/*.py"]
