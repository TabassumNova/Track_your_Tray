[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "track-your-tray"
version = "0.0.1"
description = "ROI detection and tracking for trays using ArUco markers"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Tasnim Tabassum Nova", email = "tabassumnova1@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "streamlit",
    "opencv-python",
    "numpy",
    "matplotlib",
    "hylite",
    "markerkit"
    # TODO: Add other dependencies from requirements.txt
]

[project.scripts]
track = "track_your_tray.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/Track_your_Tray"
Repository = "https://github.com/yourusername/Track_your_Tray.git"

[tool.setuptools]
packages = ["track_your_tray"]

[tool.setuptools.package-data]
track_your_tray = ["**/*.py"]
